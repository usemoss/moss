name: Moss benchmark

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    name: Benchmark unit tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install -r benchmarks/requirements-ci.txt

      - name: Run credential-free tests
        run: python -m unittest discover -s benchmarks/tests -v

      - name: Explain when live measurements are unavailable
        if: >-
          ${{ always() &&
              (github.event_name == 'pull_request' ||
               github.ref != 'refs/heads/main' ||
               vars.MOSS_BENCHMARK_ENABLED != 'true') }}
        run: |
          {
            echo '### Live Moss benchmark: not measured'
            echo 'This run checks the benchmark implementation with credential-free tests.'
            echo 'Live latency measurements require a main-branch push or manual main-branch run, with MOSS_BENCHMARK_ENABLED set to true and Moss project secrets configured.'
            echo 'Pull requests do not receive Moss secrets or run the live benchmark.'
          } >> "$GITHUB_STEP_SUMMARY"

  measure:
    name: Live Moss latency measurement
    needs: tests
    if: >-
      ${{ vars.MOSS_BENCHMARK_ENABLED == 'true' &&
          github.ref == 'refs/heads/main' &&
          (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install benchmark dependencies
        run: python -m pip install -r benchmarks/requirements-ci.txt

      # Build the fixed index fresh. Do not cache or publish indexes, model
      # weights, credentials, or device identity files.
      - name: Measure latency and write the result
        env:
          MOSS_PROJECT_ID: ${{ secrets.MOSS_PROJECT_ID }}
          MOSS_PROJECT_KEY: ${{ secrets.MOSS_PROJECT_KEY }}
          MOSS_BENCHMARK_LATENCY_GUARD_ENABLED: ${{ vars.MOSS_BENCHMARK_LATENCY_GUARD_ENABLED }}
          MOSS_BENCHMARK_COMPETITOR_AGREEMENT_ENABLED: ${{ vars.MOSS_BENCHMARK_COMPETITOR_AGREEMENT_ENABLED }}
          MOSS_BENCHMARK_RUNNER: ubuntu-24.04
        shell: bash
        run: |
          benchmark_args=(--output .benchmark-results/result.json)
          if [[ "$MOSS_BENCHMARK_LATENCY_GUARD_ENABLED" == "true" ]]; then
            benchmark_args+=(--baseline benchmarks/latency-baseline.json)
          fi
          if [[ "$MOSS_BENCHMARK_COMPETITOR_AGREEMENT_ENABLED" == "true" ]]; then
            benchmark_args+=(--competitor-reference benchmarks/competitor-reference.json)
          fi
          python benchmarks/run_ci.py "${benchmark_args[@]}"

      # This temporary result artifact is an initial integration stage, not
      # the durable history requested by issue #435.
      - name: Upload the measurement result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: moss-benchmark-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: .benchmark-results/result.json
          if-no-files-found: error
          retention-days: 90
