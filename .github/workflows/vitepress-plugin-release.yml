name: Publish vitepress-plugin-moss

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: vitepress-plugin-moss-release
  cancel-in-progress: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
      major_minor: ${{ steps.compute.outputs.major_minor }}
      patch: ${{ steps.compute.outputs.patch }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version from package.json
        id: compute
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish vitepress-plugin-moss only runs from main, not $GITHUB_REF" >&2
            exit 1
          fi

          cd packages/vitepress-plugin-moss
          VERSION=$(node -p "require('./package.json').version")

          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            MAJOR="${BASH_REMATCH[1]}"
            MINOR="${BASH_REMATCH[2]}"
            PATCH="${BASH_REMATCH[3]}"
            MM="${MAJOR}.${MINOR}"
          else
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "major_minor=${MM}" >> $GITHUB_OUTPUT
          echo "patch=${PATCH}" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

  build:
    needs: determine-version
    runs-on: ubuntu-latest

    env:
      PKG_DIR: packages/vitepress-plugin-moss
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "pnpm"
          cache-dependency-path: ${{ env.PKG_DIR }}/pnpm-lock.yaml

      - name: Install dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: pnpm install --frozen-lockfile

      - name: Build package
        working-directory: ${{ env.PKG_DIR }}
        run: pnpm build

      - name: Pack the package
        working-directory: ${{ env.PKG_DIR }}
        run: |
          pnpm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/vitepress-plugin-moss-$VERSION.tgz"
          for f in package/dist/index.js package/dist/index.cjs package/dist/index.d.ts package/Search.vue; do
            tar -tzf "$TARBALL" | grep -qx "$f" || { echo "$f is missing from $TARBALL" >&2; exit 1; }
          done

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/vitepress-plugin-moss-${{ env.VERSION }}.tgz
          if-no-files-found: error

  # npm trusts this job through OIDC (trusted publishing), so it runs no package
  # code: it only uploads the tarball the build job made.
  publish:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write # for tagging
      id-token: write

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}

      # Trusted publishing needs Node 22.14 and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Tag release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/npm-release-tag.sh "vitepress-plugin-moss" "vitepress-plugin-moss-v${VERSION}"

      - name: Publish to npm
        if: steps.tag.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/vitepress-plugin-moss-$VERSION.tgz" --access public --ignore-scripts --tag "$DIST_TAG"
