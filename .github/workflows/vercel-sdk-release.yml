name: Publish vercel-sdk

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: vercel-sdk-release
  cancel-in-progress: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version from package.json
        id: compute
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish vercel-sdk only runs from main, not $GITHUB_REF" >&2
            exit 1
          fi

          cd packages/vercel-sdk
          VERSION=$(node -p "require('./package.json').version")

          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            :
          else
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

  build:
    needs: determine-version
    runs-on: ubuntu-latest

    env:
      PKG_DIR: packages/vercel-sdk
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: npm ci

      - name: Build package
        working-directory: ${{ env.PKG_DIR }}
        run: npm run build

      - name: Pack the package
        working-directory: ${{ env.PKG_DIR }}
        run: npm pack --pack-destination "$RUNNER_TEMP"

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/moss-tools-vercel-sdk-${{ env.VERSION }}.tgz
          if-no-files-found: error

  # npm trusts this job through OIDC (trusted publishing), so it runs no package
  # code: it only uploads the tarball the build job made.
  publish:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write # for tagging
      id-token: write

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}

      # Trusted publishing needs Node 22.14 and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Skipping a version that's already out lets a re-run finish a release
      # whose tag push failed after the publish went through.
      - name: Publish to npm
        run: |
          if [[ -n "$(npm view "@moss-tools/vercel-sdk@$VERSION" version 2>/dev/null)" ]]; then
            echo "@moss-tools/vercel-sdk@$VERSION is already on npm, skipping publish"
            exit 0
          fi

          # npm 11 refuses to publish a prerelease to the default latest tag.
          DIST_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          fi

          npm publish "$RUNNER_TEMP/moss-tools-vercel-sdk-$VERSION.tgz" --access public --ignore-scripts --tag "$DIST_TAG"

      - name: Tag release
        run: |
          if git ls-remote --exit-code --tags origin "refs/tags/vercel-sdk-v${VERSION}" >/dev/null; then
            echo "Tag vercel-sdk-v${VERSION} already exists"
            exit 0
          fi

          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag "vercel-sdk-v${VERSION}"
          git push origin "vercel-sdk-v${VERSION}"
