name: Publish vercel-sdk

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: vercel-sdk-release
  cancel-in-progress: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Get version from package.json
        id: compute
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish vercel-sdk only runs from main, not $GITHUB_REF" >&2
            exit 1
          fi

          cd packages/vercel-sdk
          VERSION=$(node -p "require('./package.json').version")

          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            :
          else
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

  build:
    needs: determine-version
    runs-on: ubuntu-latest

    env:
      PKG_DIR: packages/vercel-sdk
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: npm ci

      - name: Build package
        working-directory: ${{ env.PKG_DIR }}
        run: npm run build

      - name: Pack the package
        working-directory: ${{ env.PKG_DIR }}
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/moss-tools-vercel-sdk-$VERSION.tgz"
          for f in package/dist/index.js package/dist/index.d.ts; do
            tar -tzf "$TARBALL" | grep -qx "$f" || { echo "$f is missing from $TARBALL" >&2; exit 1; }
          done

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/moss-tools-vercel-sdk-${{ env.VERSION }}.tgz
          if-no-files-found: error

  # npm trusts this job through OIDC (trusted publishing), so it runs no package
  # code: it only uploads the tarball the build job made.
  publish:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write # for tagging
      id-token: write

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}

      # Trusted publishing needs Node 22.14 and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      # Tagging first means the tag always marks the commit that built the
      # tarball, including on a retry after a failed publish.
      - name: Tag release
        id: tag
        run: |
          TAG="vercel-sdk-v${VERSION}"
          TAGGED_SHA=$(git ls-remote origin "refs/tags/$TAG" | cut -f1)

          if [[ -n "$(npm view "@moss-tools/vercel-sdk@$VERSION" version 2>/dev/null)" ]]; then
            if [[ "$TAGGED_SHA" == "$GITHUB_SHA" ]]; then
              echo "@moss-tools/vercel-sdk@$VERSION is already on npm and tagged at $GITHUB_SHA, nothing left to do"
              echo "published=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            echo "@moss-tools/vercel-sdk@$VERSION is already on npm. Bump the version in package.json." >&2
            exit 1
          fi

          if [[ "$TAGGED_SHA" == "$GITHUB_SHA" ]]; then
            echo "$TAG already points at $GITHUB_SHA"
            exit 0
          fi

          # The version never reached npm, so a tag left by a failed run marks
          # nothing and can move to the commit being published now.
          git config user.name "github-actions"
          git config user.email "github-actions@users.noreply.github.com"
          git tag -f "$TAG"
          git push -f origin "$TAG"

      - name: Publish to npm
        if: steps.tag.outputs.published != 'true'
        run: |
          # npm 11 refuses to publish a prerelease to the default latest tag.
          DIST_TAG=latest
          if [[ "$VERSION" == *-* ]]; then
            DIST_TAG=next
          fi

          npm publish "$RUNNER_TEMP/moss-tools-vercel-sdk-$VERSION.tgz" --access public --ignore-scripts --tag "$DIST_TAG"
