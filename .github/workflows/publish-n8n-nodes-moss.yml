name: Publish n8n-nodes-moss

permissions:
  contents: read

on:
  workflow_dispatch:

concurrency:
  group: n8n-nodes-moss-release
  cancel-in-progress: false

jobs:
  determine-version:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.compute.outputs.version }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Get version from package.json
        id: compute
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Publish n8n-nodes-moss only runs from main, not $GITHUB_REF" >&2
            exit 1
          fi

          cd packages/n8n-nodes-moss
          VERSION=$(node -p "require('./package.json').version")

          if [[ $VERSION =~ ^([0-9]+)\.([0-9]+)\.([0-9]+) ]]; then
            :
          else
            echo "Invalid version in package.json: $VERSION" >&2
            exit 1
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "Publishing version: $VERSION"

  build:
    needs: determine-version
    runs-on: ubuntu-latest

    env:
      PKG_DIR: packages/n8n-nodes-moss
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: ${{ env.PKG_DIR }}/package-lock.json

      - name: Install dependencies
        working-directory: ${{ env.PKG_DIR }}
        run: npm ci --ignore-scripts

      - name: Build package
        working-directory: ${{ env.PKG_DIR }}
        run: npm run build

      - name: Test package
        working-directory: ${{ env.PKG_DIR }}
        run: npm test

      # --ignore-scripts skips prepack, which would build and test again.
      - name: Pack the package
        working-directory: ${{ env.PKG_DIR }}
        run: |
          npm pack --ignore-scripts --pack-destination "$RUNNER_TEMP"
          TARBALL="$RUNNER_TEMP/n8n-nodes-moss-$VERSION.tgz"
          for f in package/dist/nodes/Moss/Moss.node.js package/dist/credentials/MossApi.credentials.js; do
            tar -tzf "$TARBALL" | grep -qx "$f" || { echo "$f is missing from $TARBALL" >&2; exit 1; }
          done

      - name: Keep the package
        uses: actions/upload-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}/n8n-nodes-moss-${{ env.VERSION }}.tgz
          if-no-files-found: error

  # npm trusts this job through OIDC (trusted publishing), so it runs no package
  # code: it only uploads the tarball the build job made.
  publish:
    needs: [determine-version, build]
    runs-on: ubuntu-latest
    environment: Production
    permissions:
      contents: write # for tagging
      id-token: write

    env:
      VERSION: ${{ needs.determine-version.outputs.version }}

    steps:
      - uses: actions/checkout@v4

      - name: Download the package
        uses: actions/download-artifact@v4
        with:
          name: npm-package
          path: ${{ runner.temp }}

      # Trusted publishing needs Node 22.14 and npm 11.5.1 or later.
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Tag release
        id: tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/scripts/npm-release-tag.sh "n8n-nodes-moss" "n8n-nodes-moss-v${VERSION}"

      - name: Publish to npm
        if: steps.tag.outputs.published != 'true'
        env:
          DIST_TAG: ${{ steps.tag.outputs.dist_tag }}
        run: npm publish "$RUNNER_TEMP/n8n-nodes-moss-$VERSION.tgz" --access public --ignore-scripts --tag "$DIST_TAG"
